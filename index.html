<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素冒险：勇者之旅</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
           image-rendering: pixelated; image-rendering: crisp-edges; }
  .ui { position: absolute; inset: 0; pointer-events: none; }
  #hud { position: absolute; top: 2.2%; left: 2.5%; right: 2.5%; display: flex;
         justify-content: space-between; color: #fff; font-family: "Microsoft YaHei", sans-serif;
         font-weight: 700; text-shadow: 2px 2px 0 rgba(0,0,0,.7); font-size: clamp(10px, 1.6vw, 20px);
         letter-spacing: 1px; }
  #hud .coin { color: #ffd23f; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1.8vh; text-align: center;
            color: #fff; font-family: "Microsoft YaHei", sans-serif; text-shadow: 2px 2px 0 rgba(0,0,0,.75);
            background: rgba(8, 8, 20, .55); }
  .screen.hidden { display: none; }
  .screen h1 { font-size: clamp(26px, 5.2vw, 62px); letter-spacing: .12em; margin: 0;
               color: #ffd23f; text-shadow: 3px 3px 0 #7a3f00, 6px 6px 0 rgba(0,0,0,.6); }
  .screen h2 { font-size: clamp(18px, 3vw, 36px); margin: 0; letter-spacing: .1em; }
  .screen p { font-size: clamp(11px, 1.5vw, 18px); margin: 0; color: #dfe6ee; line-height: 1.9; }
  .screen .blink { animation: blink 1.1s steps(2) infinite; color: #ffe98a; }
  @keyframes blink { 50% { opacity: 0; } }
  .keys { display: flex; gap: 1.6vw; flex-wrap: wrap; justify-content: center; }
  .keys span { border: 2px solid rgba(255,255,255,.55); border-radius: 6px; padding: .3em .7em;
               font-size: clamp(10px, 1.3vw, 16px); background: rgba(0,0,0,.35); }
  #titleCoin { width: clamp(28px, 5vw, 60px); image-rendering: pixelated;
               animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-14%); } }
  /* 选关按钮 */
  .lvl-btns { display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  .lvl-btn {
    font-family: inherit; cursor: pointer; text-shadow: 2px 2px 0 rgba(0,0,0,.7);
    border: 3px solid rgba(255,255,255,.75); border-radius: 12px; background: rgba(0,0,0,.4);
    color: #fff; padding: 1.4vh 2.4vw; font-size: clamp(13px, 1.9vw, 24px); font-weight: 700;
    letter-spacing: .06em; transition: transform .12s, border-color .12s, background .12s;
  }
  .lvl-btn:hover { transform: scale(1.05); border-color: #ffd23f; }
  .lvl-btn.sel { border-color: #ffd23f; background: rgba(122, 63, 0, .55); }
  .lvl-btn.locked { opacity: .45; cursor: not-allowed; }
  .lvl-btn small { display: block; font-size: .62em; font-weight: 400; opacity: .85; letter-spacing: .04em; }
  /* 语言按钮 */
  .lang-btn {
    pointer-events: auto; font-family: inherit; cursor: pointer;
    border: 2px solid rgba(255,255,255,.6); border-radius: 8px; background: rgba(0,0,0,.4);
    color: #fff; padding: .45em 1.1em; font-size: clamp(11px, 1.4vw, 17px); font-weight: 700;
  }
  .lang-btn:hover { border-color: #ffd23f; color: #ffd23f; }
  .title-foot { position: absolute; bottom: 3.5%; left: 0; right: 0; display: flex;
                justify-content: center; pointer-events: auto; }
  /* 通用按钮（暂停等） */
  .ui button.ui-btn {
    pointer-events: auto; font-family: inherit; cursor: pointer;
    border: 2px solid rgba(255,255,255,.6); border-radius: 8px; background: rgba(0,0,0,.4);
    color: #fff; padding: .45em 1.2em; font-size: clamp(11px, 1.4vw, 17px); font-weight: 700;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>
  <div class="ui">
    <div id="hud">
      <span>🏰 <span id="hudLevel">1-1</span></span>
      <span class="coin">🪙 <span id="hudCoins">0</span>/<span id="hudCoinsTotal">0</span></span>
    </div>
    <div class="screen" id="titleScreen">
      <canvas id="titleCoin" width="10" height="10"></canvas>
      <h1 id="tTitle"></h1>
      <h2 id="tSubtitle"></h2>
      <div class="lvl-btns" id="lvlButtons"></div>
      <div class="keys" id="tKeys"></div>
      <p id="tGoal"></p>
      <p class="blink" id="tPress"></p>
      <div class="title-foot">
        <button class="lang-btn" id="langBtn"></button>
      </div>
    </div>
    <div class="screen hidden" id="clearScreen">
      <h2 id="clearTitle"></h2>
      <p id="clearCoins"></p>
      <p id="clearUnlock" style="color:#7dffb0;font-weight:700"></p>
      <p class="blink" id="clearNext"></p>
    </div>
    <div class="screen hidden" id="winScreen">
      <h1 id="winTitle"></h1>
      <h2 id="winSub"></h2>
      <p id="winStats"></p>
      <p id="winFuture"></p>
      <p class="blink" id="winBack"></p>
    </div>
    <div class="screen hidden" id="pauseScreen">
      <h2 id="pauseTitle">⏸</h2>
      <p id="pauseHint"></p>
      <button class="ui-btn" id="btnResume"></button>
    </div>
  </div>
</div>
<script>
  const gs = document.createElement("script");
  gs.src = "js/game.js?v=" + Date.now();
  document.body.appendChild(gs);
</script>
</body>
</html>
